:root{--bgimg:url(__BG__);--hd:'Nunito','Trebuchet MS',system-ui,sans-serif;--tx:'Nunito',system-ui,sans-serif}

.logo{font-size:27px;line-height:1;text-shadow:0 2px 0 #fff9,0 4px 10px #0003;letter-spacing:-.3px}.logo b{text-shadow:0 2px 0 #fff9,0 4px 10px #0003}
.sec h2{font-size:30px;text-shadow:0 2px 0 #fff9,0 3px 8px #0002}.bk h2{font-size:29px}.ttl{font-size:32px;letter-spacing:-.4px}.rt{font-size:19px}
.cta{font-size:18px;letter-spacing:.2px}.cta.sm{font-size:15px}.rib{font-size:17px}.card h3{font-size:19px}.row h3{font-size:17px}.feat h3{font-size:24px}.gc h3{font-size:15.5px}.txt h3{font-size:20px}.rr{font-size:17px!important}
.txt{font-size:17.5px;line-height:1.62;font-weight:600}.txt p.n{font-weight:600}.bk p{font-weight:600}.card .d{font-weight:600}

</style></head><body>
<div id="bg"></div><div id="fx"></div><div id="app"></div>
<script>
const D=__DATA__,IM=__IMG__;IM.main=IM.__main;IM.stk=IM.__stk;
const $=s=>document.querySelector(s);
let st={v:'home',ch:0,pg:0,q:'',f:'all',sel:0,anim:true},prog={},marks=[];
try{prog=JSON.parse(localStorage.getItem('kp')||'{}');marks=JSON.parse(localStorage.getItem('km')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('kp',JSON.stringify(prog));localStorage.setItem('km',JSON.stringify(marks))}catch(e){}};
const P={home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',book:'M2 5c3-1 6-1 10 1 4-2 7-2 10-1v14c-3-1-6-1-10 1-4-2-7-2-10-1zM12 6v14',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',star:'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z',clock:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2',gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',heart:'M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',menu:'M4 7h16M4 12h16M4 17h16',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',arrow:'M4 12h16M14 6l6 6-6 6',bm:'M6 3h12v18l-6-4-6 4z',img:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M8.5 9.5h.01'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const im=(k,c='')=>`<img class="${c}" src="${IM[k]}" alt="">`;
const NAV=[['home','home','Главная'],['stories','book','Истории'],['chapters','list','Главы'],['album','img','Альбом'],['fav','star','Любимые']];
const pages=c=>{if(c._p)return c._p;let r=[],cur=[],n=0;for(const b of c.b){const w=b[0]=='m'?330:b[1].length;if(n+w>650&&cur.length){r.push(cur);cur=[];n=0}cur.push(b);n+=w}if(cur.length)r.push(cur);return c._p=r};
const blk=b=>b[0]=='p'?`<p>${b[1]}</p>`:b[0]=='h'?`<h3>${b[1]}</h3>`:b[0]=='q'?`<blockquote>${b[1]}</blockquote>`:b[0]=='n'?`<p class="n">${b[1]}</p>`:`<div class="md"><span>${{photo:'📷',video:'🎬',audio:'🎧',chat:'💬'}[b[1]]||'📎'}</span>${b[2]}</div>`;
const ck=(c,p)=>c+':'+p,mins=c=>Math.max(2,Math.round(c.len/1100)),desk=()=>innerWidth>=900;
const grp=i=>i<=17?'sp':i<=28?'su':'au';
const exc=c=>{const t=(c.b.find(b=>b[0]=='p'&&b[1].length>60)||c.b[0])[1].replace(/<[^>]+>/g,'');return t.length>110?t.slice(0,108).replace(/\s\S*$/,'')+'…':t};
function go(v,ch,pg){st.v=v;if(ch!=null)st.ch=ch;if(pg!=null)st.pg=pg;if(v=='read'){prog.last={ch:st.ch,pg:st.pg};save()}render();scrollTo(0,0)}
function turn(d){const c=D[st.ch],n=pages(c).length;let p=st.pg+d;st.dir=d;if(p>=n){if(st.ch<D.length-1)return go('read',st.ch+1,0);return go('home')}if(p<0){if(st.ch>0)return go('read',st.ch-1,pages(D[st.ch-1]).length-1);return}st.dir=d;st.pg=p;prog.last={ch:st.ch,pg:p};save();render()}
function burst(e){const x=e&&e.clientX||innerWidth/2,y=e&&e.clientY||innerHeight/2;for(let i=0;i<10;i++){const h=document.createElement('i');h.className='bh';h.textContent=['♥','✿','★'][i%3];h.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*160}px;--dy:${-60-Math.random()*120}px`;document.body.appendChild(h);setTimeout(()=>h.remove(),1100)}}
function mark(e){burst(e);const k=ck(st.ch,st.pg),i=marks.indexOf(k);i<0?marks.push(k):marks.splice(i,1);save();render()}
function pick(i){if(desk()){st.sel=i;render()}else go('read',i,0)}
function nav(v){const l=prog.last||{ch:0,pg:0};if(v=='fav'){st.f='fav';go('stories')}else{if(v=='stories')st.f='all';go(v)}}
const fav=i=>marks.some(k=>+k.split(':')[0]==i);
const list=()=>D.map((c,i)=>[c,i]).filter(([c,i])=>st.f=='all'?1:st.f=='fav'?fav(i):grp(i)==st.f).filter(([c])=>!st.q||(c.t+c.date).toLowerCase().includes(st.q.toLowerCase()));
const rowc=(c,i)=>`<button class="card" onclick="go('read',${i},0)"><div class="im">${im(ci(c))}</div><div><h3>${c.num?c.num+'. ':''}${c.t}</h3><div class="d">${exc(c)}</div><div class="m"><span>${ic('clock')} ${mins(c)} мин</span></div></div>${fav(i)?'<span class="st">★</span>':''}</button>`;
const gc=(c,i)=>`<button class="gc" onclick="go('read',${i},0)"><div class="im">${im(ci(c))}</div><h3>${c.t}</h3><p>${exc(c).slice(0,60)}…</p><small>${ic('clock')} ${mins(c)} мин</small><span class="hx">${ic('heart')}</span></button>`;
const land=`<div class="land"><svg viewBox="0 0 400 90" preserveAspectRatio="none"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a3"/><stop offset="1" stop-color="#f7a98a"/></linearGradient></defs><rect width="400" height="90" fill="url(#sk)"/><circle cx="200" cy="52" r="20" fill="#ffe9a8"/><path d="M0 60l60-30 50 24 60-34 70 40 60-26 100 30v36H0z" fill="#9b8ac0"/><rect y="62" width="400" height="10" fill="#8fc4d6"/>${[...Array(14)].map((_,i)=>`<path d="M${i*30-6} 80l12-34 12 34z" fill="#3f7d4f"/>`).join('')}<rect y="78" width="400" height="12" fill="#5c9a4f"/></svg></div>`;
function head(){return `<div class="top"><div class="logo hd" onclick="go('home')">Та, которую<br><b>невозможно забыть</b></div><div class="dnav dn">${NAV.slice(0,4).map(a=>`<button class="${st.v==a[0]?'on':''}" onclick="nav('${a[0]}')">${ic(a[1])}${a[2]}</button>`).join('')}<button onclick="go('read',${(prog.last||{}).ch||0},${(prog.last||{}).pg||0})" class="${st.v=='read'?'on':''}">${ic('heart')}Читать</button></div><div class="hs">${ic('search')}<input placeholder="Поиск главы…" value="${st.q}" oninput="st.q=this.value;st.v='chapters';render();const e=document.querySelector('.hs input');e.focus();e.setSelectionRange(99,99)"></div><button class="ib mob" onclick="go('chapters')">${ic('search')}</button><button class="ib pk mob" onclick="nav('stories')">${ic('menu')}</button></div>`}
function side(){return `<aside class="side">${[...NAV,['set','gear','Настройки']].map(a=>a[0]=='set'?`<button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">${ic(a[1])}${'Тема'}</button>`:`<button class="${(st.v==a[0]&&!(a[0]=='stories'&&st.f=='fav'))||(a[0]=='fav'&&st.f=='fav'&&st.v=='stories')?'on':''}" onclick="nav('${a[0]}')">${ic(a[1])}${a[2]}</button>`).join('')}<div class="note">Хорошие истории всегда рядом ♥</div></aside>`}
function home(){const c=D[0],l=prog.last||{ch:0,pg:0};
return `<div class="hero"><div class="peek l"><img src="${IM.gp}"></div><div class="peek r"><img src="${IM.gi}"></div><div class="bk"><div><h2 class="hd">${'Пролог'}</h2><p>${c.b[0][1]}</p><p>${c.b[1][1].slice(0,120)}…</p></div><div><p>${c.b[3][1].slice(0,150)}…</p><button class="cta sm" onclick="go('read',${l.ch},${l.pg})">${prog.last?'Продолжить':'Читать дальше'} ${ic('arrow')}</button></div>${land}</div></div>
<div class="sec"><h2 class="hd">Темы</h2><a onclick="nav('stories')">Смотреть все ${ic('arrow')}</a></div><div class="themes">${[['sp','Весна','#fbd0d0',4],['su','Лето','#fbe6a8',14],['au','Осень','#cfe4f7',24],['fav','Любимые','#d6ecc6',32]].map(t=>`<button class="th" style="background:${t[2]}" onclick="st.f='${t[0]}';go('stories')">${im(ci(D[t[3]]))}<span style="background:${t[2]}">${t[1]}</span></button>`).join('')}</div>
<div class="sec"><h2 class="hd">Главы</h2><a onclick="nav('chapters')">Все главы ${ic('arrow')}</a></div><div class="list">${D.slice(1,5).map((c,i)=>rowc(c,i+1)).join('')}</div>`}
function stories(){const L=list(),F=L[0],flt=[['all','Все главы','book'],['sp','Весна','heart'],['su','Лето','star'],['au','Осень','clock'],['fav','Любимые','star']];
const chips=`<div class="chips">${flt.map(f=>`<button class="chip ${st.f==f[0]?'on':''}" onclick="st.f='${f[0]}';render()">${f[1]}</button>`).join('')}</div>`;
const feat=F?`<div class="feat"><div class="rr">${prog.last&&st.f=='all'?'Продолжить':'С начала'}</div><div class="fi">${im(ci(F[0]))}</div><div class="fb"><h3>${F[0].t}</h3><p>${exc(F[0])}</p><div class="meta"><span>${ic('book')} ${F[1]?'Глава '+F[1]+' из 34':'Вступление'}</span><span>${ic('clock')} ${mins(F[0])} мин</span></div><button class="cta sm" onclick="go('read',${F[1]},0)" style="margin-top:10px">Открыть историю ${ic('arrow')}</button></div></div>`:'';
const rest=L.slice(1);
return `<div class="sp"><div><h2 class="hd">Истории</h2><p style="margin:0 0 6px;color:var(--mut)">Тёплые, живые и честные главы</p>${chips}${F?feat:`<div class="empty">${st.f=='fav'?'Пока пусто. Нажми на закладку на любой странице ♥':'Ничего не найдено'}</div>`}</div><div><div class="grid">${rest.map(([c,i])=>gc(c,i)).join('')}</div></div></div>`}
function chapters(){const L=list(),s=Math.min(st.sel,D.length-1),c=D[s];
const rows=L.map(([c,i])=>`<button class="row ${desk()&&i==s?'on':''}" onclick="pick(${i})"><div class="im">${im(ci(c))}</div><div style="flex:1"><small>${c.num?'Глава '+c.num:'Вступление'}</small><h3>${c.t}</h3></div>${ic('right')}</button>`).join('');
const det=`<div class="deskonly"><span class="rib">${c.num?'Глава '+c.num:'Вступление'}</span><h2 class="hd ttl">${c.t}</h2><div class="ill" style="padding:8px 0"><div class="fr" style="aspect-ratio:16/10;height:auto">${im(ci(c))}</div></div><div class="meta" style="margin:12px 0"><span>${ic('clock')} ${mins(c)} мин</span><span class="pill">${c.date||'Начало'}</span><span class="pill bl">${pages(c).length} стр.</span></div><p style="font-size:18px;line-height:1.5;color:var(--mut)">${exc(c)}</p><button class="cta" style="margin-top:14px;max-width:340px" onclick="go('read',${s},0)">${ic('book')} Начать чтение ${ic('arrow')}</button></div>`;
return `<div class="sp"><div><h2 class="hd">Главы</h2><div class="list" style="grid-template-columns:1fr;max-height:640px;overflow:auto;padding:4px;margin-top:8px">${rows||'<div class="empty">Ничего не найдено</div>'}</div></div><div>${det}</div></div>`}
function read(){const c=D[st.ch],Pg=pages(c),n=Pg.length,m=marks.includes(ck(st.ch,st.pg)),pc=(st.pg+1)/n*100;
const hd=st.pg==0?`<span class="rib">${c.num?'Глава '+c.num:'Вступление'}</span><h1 class="ttl">${c.t}</h1><div class="dt">${c.date}</div>`:'';
const bar=`<div class="rb">${ic('book')}<i><u style="width:${pc}%"></u><em style="left:${pc}%">${im(ci(c))}</em></i><span>${st.pg+1} / ${n}</span></div>`;
return `<div class="rtop"><button class="ib rd" onclick="go('chapters')">${ic('left')}</button><div class="rt">${c.num?'Глава '+c.num+' — ':''}${c.t}</div><button class="ib pk" onclick="mark(event)">${ic('bm')}</button></div>
<div class="rbk"><div class="ill">${art(st.ch,st.pg)}<div class="curl"></div></div><div class="txt ${st.anim?(st.dir<0?'a b':'a'):''}">${hd}${Pg[st.pg].map(blk).join('')}<span class="leaf">🍃</span></div></div>
<div class="mobonly">${bar}<div class="nav"><button class="ib" onclick="turn(-1)">${ic('left')}</button><button class="cta" onclick="turn(1)">${st.pg==n-1?(st.ch<D.length-1?'Дальше':'В начало'):'Перелистнуть'} ${ic('arrow')}</button></div><div class="foot"><img src="${IM.gt}"></div></div>
<div class="nav deskonly"><button class="ib" onclick="turn(-1)">${ic('left')}</button>${bar}<button class="go" onclick="turn(1)">${ic('arrow')}</button><button class="ib" onclick="mark(event)" style="${m?'color:var(--co)':''}">${ic('bm')}</button><div class="tg" onclick="st.anim=!st.anim;render()"><div class="sw ${st.anim?'':'off'}"></div>Анимация<br>перелистывания</div></div>`}
function render(){const l=prog.last||{ch:0,pg:0};let h=head()+side()+'<main>';
h+=st.v=='home'?home():st.v=='stories'?stories():st.v=='chapters'?chapters():st.v=='album'?album():read();
if(desk()){h+=`<img class="dpk" src="${IM.gp}" style="left:-96px;top:560px;width:130px"><img class="dpk" src="${IM.gi}" style="right:-14px;top:-34px;width:110px"><img class="dpk" src="${IM.gg}" style="right:-56px;bottom:-10px;width:130px">`}
h+=`</main><nav class="tabs"><div>${NAV.map(a=>`<button class="${(st.v==a[0]&&!(a[0]=='stories'&&st.f=='fav'))||(a[0]=='fav'&&st.f=='fav'&&st.v=='stories')?'on':''}" onclick="nav('${a[0]}')">${ic(a[1])}${a[2]}</button>`).join('')}<div class="peek"><img src="${IM.gg}"></div></div></nav>`;
document.body.dataset.mood=st.v=='read'?moodOf(D[st.ch].mood):'home';fx(document.body.dataset.mood);$('#app').className='v-'+st.v;$('#app').innerHTML=h;const bk=$('.rbk');if(bk){let x=0;bk.ontouchstart=e=>x=e.touches[0].clientX;bk.ontouchend=e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>60)turn(d<0?1:-1)}}}

const ci=c=>{for(let j=0;j<pages(c).length;j++){const a=AS[c.i+':'+j];if(a&&(a.m||a.s))return a.m||a.s}return 'gg'};
const AS={};const ALL=[];D.forEach((c,i)=>{c.i=i;pages(c).forEach((p,j)=>{ALL.push(i+':'+j);AS[i+':'+j]={}})});
(()=>{const N=ALL.length,M=IM.main,S=IM.stk,u=new Set();M.forEach((k,x)=>{let p=Math.floor((x+.5)*N/M.length);while(u.has(p))p=(p+1)%N;u.add(p);AS[ALL[p]].m=k});const rest=ALL.map((_,p)=>p).filter(p=>!u.has(p));S.forEach((k,x)=>{AS[ALL[rest[Math.floor((x+.5)*rest.length/S.length)]]].s=k})})();
function art(i,j){const a=AS[i+':'+j];if(a.m)return `<div class="fr">${im(a.m,'kb')}${a.s?`<div class="stkr">${im(a.s)}</div>`:''}</div>`;return `<div class="fr sk">${a.s?`<div class="stkr big">${im(a.s)}</div>`:land}<i class="sp1">✦</i><i class="sp2">♥</i><i class="sp3">✿</i></div>`}
function zoom(k){const o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="${IM[k]}">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
function album(){const all=[...IM.main,...IM.stk,'gp','gi','gg','gt'];return `<div class="sheet"><h2 class="hd" style="font-size:44px">Альбом</h2><p style="margin:0 0 12px;color:var(--mut)">Все ${all.length} кадров этой книги. Нажми, чтобы открыть.</p><div class="alb">${all.map((k,x)=>`<button style="animation-delay:${(x%14)*45}ms" onclick="zoom('${k}')">${im(k)}</button>`).join('')}</div></div>`}
const G={sun:['♥','✿','🍃','♡'],night:['✦','✧','⭐','·'],rain:['💧','🍃','♥','✿'],play:['★','♥','✿','✦'],home:['♥','✿','🍃','✦']};
const moodOf=m=>/night|lav|dream/.test(m)?'night':/rain|blue|sage|forest|distance/.test(m)?'rain':/play|peach|craft/.test(m)?'play':'sun';
function fx(m){if(fx.m==m)return;fx.m=m;$('#fx').innerHTML=[...Array(20)].map((_,i)=>`<i style="left:${(i*53)%100}%;font-size:${12+(i*7)%16}px;animation-duration:${10+(i*5)%9}s;animation-delay:-${(i*3)%14}s">${G[m][i%4]}</i>`).join('')}
function cover(){let seen=0;try{seen=sessionStorage.getItem('kc')}catch(e){}if(seen)return;const c=document.createElement('div');c.id='cover';c.innerHTML=`<div class="cv"><img src="${IM.gp}"><h1>Та, которую<br>невозможно забыть</h1><p>книга-письмо · Шуха</p><button class="cta">Открыть книгу</button><img class="cb" src="${IM.gi}"></div>`;c.onclick=()=>{c.classList.add('open');try{sessionStorage.setItem('kc','1')}catch(e){}setTimeout(()=>c.remove(),1400)};document.body.appendChild(c)}
addEventListener('keydown',e=>{if(st.v=='read'){if(e.key=='ArrowRight')turn(1);if(e.key=='ArrowLeft')turn(-1)}});
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,150)});
render();cover();
</script></body></html>
